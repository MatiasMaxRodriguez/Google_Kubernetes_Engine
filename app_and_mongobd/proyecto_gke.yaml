# 1. SECRET: Almacena las credenciales de forma segura
apiVersion: v1
kind: Secret
metadata:
  name: mongo-creds
type: Opaque
data:
  # Los valores deben estar en base64. mati = bWF0aQ== , pass = cGFzcw==
  username: bWF0aQ==
  password: cGFzcw==

---
# 2. MONGODB: Despliegue de la base de datos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
spec:
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:latest
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongo-creds
              key: username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-creds
              key: password

---
# 3. SERVICIO MONGODB: El puente DNS interno (ctmongo)
apiVersion: v1
kind: Service
metadata:
  name: ctmongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017

---
# 4. APP: Despliegue de la aplicación de animales
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-animales
spec:
  replicas: 2
  selector:
    matchLabels:
      app: animales
  template:
    metadata:
      labels:
        app: animales
    spec:
      containers:
      - name: app-container
        # Se utiliza la imagen en Artifact Registry
        image: us-central1-docker.pkg.dev/matmaxlabgke/repoappgke/mi-app-animales:v1
        ports:
        - containerPort: 3000
        env:
        - name: MONGO_URL
          # Se crea la URL usando el servicio 'ctmongo'
          value: "mongodb://mati:pass@ctmongo:27017/miapp?authSource=admin"

---
# 5. SERVICIO APP: Load Balancer para acceso externo
apiVersion: v1
kind: Service
metadata:
  name: servicio-animales
spec:
  type: LoadBalancer
  selector:
    app: animales
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000